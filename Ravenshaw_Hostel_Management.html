:#46534c}.activity-copy b{font-weight:700}.activity-time{color:#99a19c;font-size:10px;margin-top:4px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#9ba39d;font-size:10px;text-transform:uppercase;letter-spacing:.09em;padding:0 12px 12px;font-weight:700}.table td{padding:12px;border-top:1px solid #f0f2ef;color:#515d56;font-size:11px}.table td:first-child{color:#26322b;font-weight:600}.status{padding:5px 8px;border-radius:30px;font-size:10px;font-weight:700;background:#eaf5ed;color:#378057}.status.pending{background:#fff3e3;color:#b47931}.status.issue{background:#feeeec;color:#bc5c50}.content-card{margin-top:18px}.notice{background:#f3f8f4;border:1px solid #e6efe8;border-radius:10px;padding:14px;display:flex;gap:11px;margin:12px 0}.notice-icon{font-size:17px}.notice b{font-size:12px}.notice p{font-size:11px;color:#748079;margin:5px 0 0;line-height:1.5}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.quick-action{border:1px solid var(--line);background:white;border-radius:10px;padding:15px;text-align:left;color:var(--ink)}.quick-action:hover{border-color:#9bcbb0;background:#fbfefc}.quick-action .qa-icon{font-size:20px}.quick-action b{display:block;font-size:12px;margin-top:11px}.quick-action span{color:#8a948d;font-size:10px;display:block;margin-top:4px}.modal-backdrop{position:fixed;inset:0;background:#14251dcc;z-index:5;display:grid;place-items:center;padding:20px}.modal{width:min(100%,470px);background:white;border-radius:15px;padding:24px;box-shadow:var(--shadow)}.modal h2{font:700 21px 'Manrope';letter-spacing:-.04em;margin:0 0 5px}.modal>p{color:var(--muted);font-size:12px;margin:0 0 19px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.toast{position:fixed;right:24px;bottom:24px;padding:13px 17px;background:#1d4537;color:white;border-radius:10px;box-shadow:var(--shadow);z-index:9;font-size:12px;animation:slide .25s ease}@keyframes slide{fro .brand-text{display:flex;flex-direction:column;line-height:1.2}.brand-name{font:700 12px 'Manrope',sans-serif;letter-spacing:-.02em}.brand-campus{font-size:10px;color:#82928a;margin-top:3px;font-weight:500}.login-art .brand-campus{color:#a8d6bb}

<body>
  <div id="app"></div>
  <script>
const app = document.getElementById('app');
function loadResidents(){try{const rows=JSON.parse(localStorage.getItem('ravenshaw-residents')||'[]');return Array.isArray(rows)?rows.filter(r=>r&&typeof r.name==='string'&&typeof r.email==='string'&&typeof r.room==='string'):[]}catch{return []}}
function loadStore(key,fallback){try{const value=JSON.parse(localStorage.getItem(`ravenshaw-${key}`));return value??fallback}catch{return fallback}}
const defaultMeals=[['Monday','Dal tadka, roti, rice','Veg pulao, raita'],['Tuesday','Chole, jeera rice','Paneer curry, pulao'],['Wednesday','Rajma, rice, salad','Veg noodles, soup'],['Thursday','Masala dosa, sambar','Mix veg, chapati'],['Friday','Aloo paratha, curd','Khichdi, papad'],['Saturday','Veg biryani, raita','Pav bhaji'],['Sunday','Puri, chana masala','Fried rice, manchurian']];
const state = { role: 'student', user: null, page: 'Overview', notices: loadStore('notices',3), residents: loadResidents(), complaints: loadStore('complaints',[{id:'c-demo-1',email:'maya@university.edu',name:'Maya Patel',room:'B-204',category:'Maintenance',title:'Bathroom tap repair',details:'Tap is leaking.',status:'In progress',createdAt:new Date().toISOString()}]), payments: loadStore('payments',[]), meals: loadStore('meals',defaultMeals), rooms: loadStore('rooms',['A-206 · Block A','B-207 · Block B','C-104 · Block C']), profiles: loadStore('profiles',{}) };
const icons = {Overview:'◫', Residents:'♙', Rooms:'▦', Payments:'₹', Complaints:'☷', 'Meal menu':'♨', Reports:'▤', Settings:'⚙'};
function persist(key,value){try{localStorage.setItem(`ravenshaw-${key}`,JSON.stringify(value));return true}catch{return false}}
function saveResidents(){try{localStorage.setItem('ravenshaw-residents',JSON.stringify(state.residents));return true}catch{return false}}
function monthLabel(date=new Date()){return new Intl.DateTimeFormat('en-IN',{month:'long',year:'numeric'}).format(date)}
function makeId(prefix){return `${prefix}-${globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2,8)}`}`}
function ensureInvoice(email,name='Resident'){let invoice=state.payments.find(p=>p.email===email&&p.period===monthLabel());if(!invoice){invoice={id:makeId('inv'),email,name,period:monthLabel(),amount:8500,due:'10th',status:'Due'};state.payments.unshift(invoice);persist('payments',state.payments)}return invoice}
function residentName(email){return state.residents.find(r=>r.email===email)?.name||email.split('@')[0].replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function studentRoom(){return state.residents.find(r=>r.email===state.user?.email)?.room||'B-204 · Block B'}

function brand(){return '<div class="brand"><span class="brand-mark">R</span><span class="brand-text"><span class="brand-name">Ravenshaw University</span><span class="brand-campus">Mahanadi Campus</span></span></div>'}
function renderLogin(){app.innerHTML=`<div class="login-wrap"><section class="login-art">${brand()}<div class="art-copy"><span class="eyebrow">A better way to live together</span><h1>Room to grow.<br>Space to belong.</h1><p>Everything hostel life needs, thoughtfully brought together in one place.</p></div><svg class="hostel-illustration" viewBox="0 0 450 350" fill="none" aria-hidden="true"><rect x="57" y="112" width="286" height="208" rx="8" fill="#E4F2E8"/><path d="M35 116 195 28l174 88v14H35v-14Z" fill="#B7DEC5"/><path d="M35 116 195 28l174 88" stroke="#F6FFF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="84" y="150" width="88" height="72" rx="4" fill="#79B795"/><path d="M128 150v72M84 186h88" stroke="#E4F2E8" stroke-width="5"/><rect x="206" y="150" width="103" height="170" rx="4" fill="#91C5A4"/><circle cx="289" cy="239" r="4" fill="#F2F8F3"/><rect x="87" y="246" width="88" height="74" rx="4" fill="#6BA987"/><path d="M131 246v74m-44-37h88" stroke="#D8ECDD" stroke-width="5"/><path d="M57 320h286" stroke="#C4E3CE" stroke-width="7" stroke-linecap="round"/><circle cx="376" cy="90" r="31" fill="#DBEEDC"/><path d="M376 74v32m-16-16h32" stroke="#71AA83" stroke-width="4" stroke-linecap="round"/><path d="M24 290c22-17 38-16 50 0m303-6c17-15 33-15 49 0" stroke="#9CCDA9" stroke-width="5" stroke-linecap="round"/></svg><div class="art-footer">© 2026 Ravenshaw University · Mahanadi Campus</div></section><section class="login-panel"><div class="login-box">${brand()}<h2 class="login-title">Welcome back</h2><p class="login-sub">Sign in to continue to your Ravenshaw University hostel account.</p><div class="role-switch"><button class="${state.role==='student'?'active':''}" data-role="student">Student</button><button class="${state.role==='admin'?'active':''}" data-role="admin">Administrator</button></div><form id="login-form"><div class="field"><label for="email">${state.role==='student'?'Student email':'Work email'}</label><input id="email" type="email" placeholder="${state.role==='student'?'you@university.edu':'admin@haven.edu'}" required></div><div class="field"><div class="pass-row"><label for="password">Password</label><button class="text-button" type="button" id="forgot">Forgot password?</button></div><input id="password" type="password" placeholder="Enter your password" required></div><div class="login-error" id="login-error"></div><button class="primary full" type="submit">Sign in <span style="margin-left:6px">→</span></button></form><div class="demo-hint">Demo access: use any email and password.<br><strong>Student:</strong> maya@university.edu &nbsp; <strong>Admin:</strong> admin@haven.edu</div></div></section></div>`;
 app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;renderLogin()});app.querySelector('#login-form').onsubmit=e=>{e.preventDefault();const email=app.querySelector('#email').value.trim().toLowerCase();const role=state.role;const fallbackName=email.split('@')[0].replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())||(role==='admin'?'Alex Morgan':'Maya Patel');state.user={role,email,name:state.profiles[email]?.name||fallbackName};if(role==='student')ensureInvoice(email,state.user.name);state.page='Overview';renderDashboard()};app.querySelector('#forgot').onclick=()=>toast('Password reset is unavailable in this local demo. Contact your hostel administrator.')}
function navItems(){return state.user.role==='admin'?['Overview','Residents','Rooms','Payments','Complaints','Meal menu','Reports','Settings']:['Overview','My room','Payments','Complaints','Meal menu','Settings']}
function sidebar(){return `<aside class="sidebar" id="sidebar">${brand()}<div class="nav-label">Workspace</div>${navItems().map(n=>`<button class="nav-item ${state.page===n?'active':''}" data-page="${n}"><span class="icon">${icons[n]||'⌂'}</span>${n}${n==='Complaints'&&state.user.role==='admin'?'<span class="count">4</span>':''}</button>`).join('')}<div class="sidebar-bottom"><div class="nav-label">Account</div><div class="profile"><div class="avatar">${initials()}</div><div><div class="profile-name">${escapeHtml(state.user.name)}</div><div class="profile-role">${state.user.role==='admin'?'Hostel administrator':'Resident · Room B-204'}</div></div><button class="logout" aria-label="Sign out" id="logout">↪</button></div></div></aside>`}
function initials(){return state.user.name.split(/\s+/).map(v=>v[0]).slice(0,2).join('').toUpperCase()}
function dateLabel(){return new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function topbar(){return `<header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="top-icon mobile-menu" id="mobile-menu">☰</button><div class="crumb">Workspace <span style="padding:0 7px;color:#c3cbc5">/</span><b>${state.page}</b></div></div><div class="top-actions"><span class="date-label">${dateLabel()}</span><button class="top-icon" id="notifications" aria-label="Notifications">♧<i class="dot"></i></button><div class="avatar">${initials()}</div></div></header>`}
function stat(label,value,note,icon,trend=''){return `<div class="stat-card"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${trend?`<span class="${trend.startsWith('+')?'up':'down'}">${trend}</span> `:''}${note}</div></div>`}

function occupancy(){const occupied=432+state.residents.length,available=600-occupied,rate=Math.round(occupied/600*100);return `<div class="occupancy"><div class="donut" style="background:conic-gradient(#24775a 0 ${rate}%,#e6f1e8 ${rate}%)"><div class="donut-center"><strong>${rate}%</strong><span>occupied</span></div></div><div class="legend"><div class="legend-row"><span class="legend-name"><i class="legend-dot"></i>Occupied</span><strong>${occupied}</strong></div><div class="legend-row"><span class="legend-name"><i class="legend-dot"></i>Available</span><strong>${available}</strong></div><div class="legend-row"><span class="legend-name"><i class="legend-dot"></i>Total beds</span><strong>600</strong></div></div></div>`}

function genericPage(){const map={'My room':['Room B-204','Your home at Ravenshaw University','Block B · Second floor · 2 sharing','Your roommate: Ananya Rao','Room facilities: Study desk, wardrobe, attached bathroom'],'Payments':['Payments & invoices','Manage your hostel fee payments','October 2025 · ₹8,500 · Due 05 Oct','September 2025 · Paid on 02 Sep','August 2025 · Paid on 03 Aug'],'Complaints':['Requests & complaints','Track maintenance and support requests','Bathroom tap repair · In progress','Study room light · Resolved','Water cooler · Resolved'],'Meal menu':['Weekly meal menu','Fresh meals, planned for every day','Today · Paneer curry & rice','Wednesday · Veg noodles & soup','Thursday · Masala dosa & sambar'],'Residents':['Residents','Manage student profiles and allocations','486 active residents · 12 new this month','Search and filter resident records','Review resident status and room assignments'],'Rooms':['Rooms & occupancy','Manage beds across all hostel blocks','Block A · 144/200 occupied','Block B · 158/200 occupied','Block C · 130/200 occupied'],'Reports':['Reports & insights','Hostel performance at a glance','Fee collection · 82% this month','Occupancy · 72% of total capacity','Complaints · 14 open requests'],'Settings':['Settings','Manage your account preferences','Profile information','Notifications','Security and password']};const d=map[state.page]||map.Settings;return `<div class="welcome"><div><h1>${d[0]}</h1><p>${d[1]}</p></div>${state.user.role==='admin'&&state.page==='Residents'?'<button class="primary" data-modal="resident">＋ Add resident</button>':''}</div><section class="card"><div class="card-head"><div><div class="card-title">${d[0]}</div><div class="card-sub">${d[2]}</div></div>${state.page==='Complaints'?'<button class="primary" data-modal="complaint">＋ New request</button>':''}</div>${state.page==='Residents'&&state.user.role==='admin'?residentTable(true):state.page==='Rooms'&&state.user.role==='admin'?occupancy():`<div class="activity-list">${d.slice(2).map((x,i)=>`<div class="activity"><div class="activity-icon">${['♧','₹','☷'][i%3]}</div><div class="activity-copy"><b>${x}</b><div class="activity-time">${i===0?'Updated today':'Last updated recently'}</div></div><span class="status ${i===0?'pending':''}" style="margin-left:auto;align-self:center">${i===0?'In progress':'View details'}</span></div>`).join('')}</div>`}</section>`}
function renderDashboard(){const admin=state.user.role==='admin';app.innerHTML=`<div class="shell">${sidebar()}<main class="main">${topbar()}<div class="page">${state.page==='Overview'?`<div class="welcome"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${escapeHtml(state.user.name.split(' ')[0])} 👋</h1><p>${admin?'Here’s what’s happening at your hostel today.':'Here’s what’s happening in your hostel today.'}</p></div><div class="welcome-actions"><span class="date-label">${dateLabel()}</span></div></div>${admin?adminHome():studentHome()}`:genericPage()}</div></main></div>`;app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;renderDashboard()});app.querySelector('#logout').onclick=()=>{state.user=null;renderLogin()};app.querySelector('#mobile-menu').onclick=()=>app.querySelector('#sidebar').classList.toggle('open');app.querySelector('#notifications').onclick=()=>toast('You’re all caught up on notifications.');app.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal))}
function openModal(type){
 const admin=type==='resident';
 const assigned=new Set(state.residents.map(r=>r.room));
 const available=['A-206 · Block A','B-207 · Block B','C-104 · Block C'].filter(room=>!assigned.has(room));
 const fields=admin?`<div class="field"><label for="resident-name">Student name</label><input id="resident-name" name="name" placeholder="Full name" autocomplete="name" required></div><div class="field"><label for="resident-email">Email address</label><input id="resident-email" name="email" type="email" placeholder="student@university.edu" autocomplete="email" required></div><div class="field"><label for="resident-room">Assign room</label><select id="resident-room" name="room" required><option value="">Select an available room</option>${available.map(room=>`<option value="${escapeHtml(room)}">${escapeHtml(room)}</option>`).join('')}</select>${available.length?'':'<div class="card-sub" style="color:#bc5c50;margin-top:7px">No demo rooms are available. Add another room before continuing.</div>'}</div>`:`<div class="field"><label for="issue-category">Issue category</label><select id="issue-category" name="category"><option>Maintenance</option><option>Housekeeping</option><option>Food & dining</option><option>Other</option></select></div><div class="field"><label for="issue-title">What needs attention?</label><input id="issue-title" name="title" placeholder="e.g. Leaking bathroom tap" required></div><div class="field"><label for="issue-details">Details</label><textarea id="issue-details" name="details" rows="3" placeholder="Add any details that will help us resolve this"></textarea></div>`;
 app.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="backdrop"><form class="modal" id="modal-form"><h2>${admin?'Add a resident':'Report an issue'}</h2><p>${admin?'Add the student’s contact details and assign an available room.':'Tell us what’s wrong and our team will take a look.'}</p>${fields}<div class="login-error" id="form-error" aria-live="polite"></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" type="submit" ${admin&&!available.length?'disabled':''}>${admin?'Add resident':'Submit request'}</button></div></form></div>`);
 const back=app.querySelector('#backdrop'),form=app.querySelector('#modal-form');
 app.querySelector('#cancel').onclick=()=>back.remove();
 back.onclick=e=>{if(e.target===back)back.remove()};
 form.onsubmit=e=>{
  e.preventDefault();
  if(admin){
   const name=form.querySelector('#resident-name').value.trim(),email=form.querySelector('#resident-email').value.trim().toLowerCase(),room=form.querySelector('#resident-room').value;
   const error=app.querySelector('#form-error');
   if(state.residents.some(r=>r.email.toLowerCase()===email)){error.textContent='A resident with this email address already exists.';return}
   if(state.residents.some(r=>r.room===room)){error.textContent='That room was just assigned. Choose another available room.';return}
   const resident={id:makeId('resident'),name,email,room,addedAt:new Date().toISOString()};
   state.residents.unshift(resident);
   let saved=true;try{localStorage.setItem('ravenshaw-residents',JSON.stringify(state.residents))}catch{saved=false}
   back.remove();renderDashboard();toast(saved?'Resident added and saved in this browser.':'Resident added for this session; browser storage is unavailable.');
   return;
  }
  back.remove();toast('Your request has been submitted.');
 };
}

function mealTable(editable){return `<div class="table-wrap"><table class="table"><thead><tr><th>Day</th><th>Lunch</th><th>Dinner</th>${editable?'<th>Action</th>':''}</tr></thead><tbody>${state.meals.map((m,i)=>`<tr><td>${escapeHtml(m[0])}</td><td>${editable?`<input data-meal-cell="${i}-1" value="${escapeHtml(m[1])}">`:escapeHtml(m[1])}</td><td>${editable?`<input data-meal-cell="${i}-2" value="${escapeHtml(m[2])}">`:escapeHtml(m[2])}</td>${editable?`<td><button class="small-link" data-action="save-meal" data-index="${i}">Save menu</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function paymentsTable(admin){const all=allPayments(),rows=admin?all:all.filter(p=>p.email===state.user.email);return `<div class="table-wrap"><table class="table"><thead><tr>${admin?'<th>Resident</th>':''}<th>Period</th><th>Amount</th><th>Due date</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${admin?escapeHtml(p.name):escapeHtml(p.period)}</td>${admin?`<td>${escapeHtml(p.period)}</td>`:''}<td>₹${Number(p.amount).toLocaleString('en-IN')}</td><td>${escapeHtml(p.due||'—')}</td><td><span class="status ${p.status==='Paid'?'':'pending'}">${escapeHtml(p.status)}</span></td><td>${p.status==='Paid'?`<span class="card-sub">${p.paidAt?'Paid '+escapeHtml(p.paidAt):'Settled'}</span>`:`<button class="small-link" data-action="mark-paid" data-id="${escapeHtml(p.id)}">${admin?'Record payment':'Pay (demo)'}</button>`}</td></tr>`).join('')||'<tr><td colspan="6">No invoices yet.</td></tr>'}</tbody></table></div>`}
function roomsPage(){const assigned=state.residents.reduce((m,r)=>(m[r.room]=(m[r.room]||0)+1,m),{}),available=state.rooms.filter(room=>(assigned[room]||0)<2);return `<div class="card-head"><div><div class="card-title">Room allocation</div><div class="card-sub">Assign or move a registered resident to an available room.</div></div><button class="primary" data-modal="room">＋ Add room</button></div><form id="assign-room-form" class="toolbar"><label>Resident <select name="email" required><option value="">Select resident</option>${state.residents.map(r=>`<option value="${escapeHtml(r.email)}">${escapeHtml(r.name)} (${escapeHtml(r.email)})</option>`).join('')}</select></label><label>Room <select name="room" required><option value="">Select available room</option>${available.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)} · ${assigned[r]||0}/2 beds</option>`).join('')}</select></label><button class="primary" type="submit" ${!state.residents.length||!available.length?'disabled':''}>Assign room</button></form><div class="content-card">${occupancy()}</div><div class="table-wrap"><table class="table"><thead><tr><th>Room</th><th>Block</th><th>Assigned residents</th><th>Capacity</th><th>Availability</th></tr></thead><tbody>${state.rooms.map(room=>{const residents=state.residents.filter(r=>r.room===room);return `<tr><td>${escapeHtml(room.split(' · ')[0])}</td><td>${escapeHtml(room.split(' · ')[1]||'Block')}</td><td>${residents.map(r=>escapeHtml(r.name)).join(', ')||'—'}</td><td>2 beds</td><td><span class="status ${residents.length>=2?'issue':'pending'}">${Math.max(0,2-residents.length)} available</span></td></tr>`}).join('')}</tbody></table></div>`}
function genericPage(){switch(state.page){case 'Residents':return `<div class="welcome"><div><h1>Residents</h1><p>${486+state.residents.length} residents · manage student records and room assignments.</p></div><button class="primary" data-modal="resident">＋ Add resident</button></div><section class="card"><div class="toolbar"><input id="resident-filter" placeholder="Search by name, email, or room"><span class="card-sub">${state.residents.length} residents added in this browser</span></div>${residentTable(true)}</section>`;case 'Rooms':return `<div class="welcome"><div><h1>Rooms & occupancy</h1><p>View availability and assign resident rooms.</p></div></div><section class="card">${roomsPage()}</section>`;case 'Payments':return `<div class="welcome"><div><h1>Payments & invoices</h1><p>${state.user.role==='admin'?'Review invoices and record payments.':'Review your hostel fees. Demo payment recording does not charge money.'}</p></div>${state.user.role==='admin'?'<button class="primary" data-modal="invoice">＋ Create invoice</button>':''}</div><section class="card">${paymentsTable(state.user.role==='admin')}</section>`;case 'Complaints':return `<div class="welcome"><div><h1>Requests & complaints</h1><p>${state.user.role==='admin'?'Review resident requests and update their status.':'Track your maintenance and support requests.'}</p></div>${state.user.role==='student'?'<button class="primary" data-modal="complaint">＋ New request</button>':''}</div><section class="card">${requestTable(state.user.role==='admin')}</section>`;case 'Meal menu':return `<div class="welcome"><div><h1>Weekly meal menu</h1><p>${state.user.role==='admin'?'Edit the menu; changes are saved in this browser.':'Fresh meals planned for every day.'}</p></div></div><section class="card">${mealTable(state.user.role==='admin')}</section>`;case 'Reports':return `<div class="welcome"><div><h1>Reports & insights</h1><p>Current hostel snapshot from the demo data saved in this browser.</p></div><button class="primary" data-action="export-report">↓ Download CSV</button></div><div class="stats">${stat('Residents',486+state.residents.length,'Across campus','♙')}${stat('Beds occupied',432+state.residents.length,'of 600','▦')}${stat('Unpaid invoices',allPayments().filter(p=>p.status!=='Paid').length,'Current records','₹')}${stat('Open requests',openComplaints().length,'Need follow-up','☷')}</div><section class="card">${paymentsTable(true)}</section>`;case 'Settings':return `<div class="welcome"><div><h1>Settings</h1><p>Update your local demo profile and preferences.</p></div></div><section class="card"><form id="settings-form"><div class="field"><label for="profile-name">Display name</label><input id="profile-name" name="name" value="${escapeHtml(state.user.name)}" required></div><div class="field"><label for="profile-email">Email address</label><input id="profile-email" value="${escapeHtml(state.user.email)}" disabled></div><label class="check-row"><input type="checkbox" name="notifications" ${state.profiles[state.user.email]?.notifications===false?'':'checked'}> Receive in-app notifications</label><button class="primary" type="submit">Save settings</button></form></section>`;case 'My room':return `<div class="welcome"><div><h1>My room</h1><p>Your room and resident details.</p></div></div><section class="card"><h2 class="card-title">${escapeHtml(studentRoom())}</h2><div class="notice"><span class="notice-icon">⌂</span><div><b>Room facilities</b><p>Study desk, wardrobe, shared bathroom, Wi-Fi and common-room access.</p></div></div><p class="card-sub">Roommate and facilities shown here are sample information for the demo.</p></section>`;default:return '<section class="card"><p>Page not found.</p></section>'}}
function requestTable(admin){const rows=admin?state.complaints:state.complaints.filter(c=>c.email===state.user.email);return `<div class="table-wrap"><table class="table"><thead><tr>${admin?'<th>Resident</th>':''}<th>Request</th><th>Category</th><th>Room</th><th>Submitted</th><th>Status</th>${admin?'':'<th>Action</th>'}</tr></thead><tbody>${rows.map(c=>`<tr>${admin?`<td>${escapeHtml(c.name)}<br><span class="card-sub">${escapeHtml(c.email)}</span></td>`:''}<td>${escapeHtml(c.title)}${c.details?`<br><span class="card-sub">${escapeHtml(c.details)}</span>`:''}</td><td>${escapeHtml(c.category)}</td><td>${escapeHtml(c.room||'—')}</td><td>${new Date(c.createdAt).toLocaleDateString()}</td><td>${admin?`<select data-complaint-status="${escapeHtml(c.id)}">${['New','In progress','Resolved','Cancelled'].map(status=>`<option ${c.status===status?'selected':''}>${status}</option>`).join('')}</select>`:`<span class="status ${c.status==='Resolved'?'':'pending'}">${escapeHtml(c.status)}</span>`}</td>${admin?'':`<td>${['New','In progress'].includes(c.status)?`<button class="small-link" data-action="cancel-complaint" data-id="${escapeHtml(c.id)}">Cancel</button>`:'—'}</td>`}</tr>`).join('')||'<tr><td colspan="7">No requests yet.</td></tr>'}</tbody></table></div>`}
function residentRowsForInvoice(){return [...DEMO_PEOPLE,...state.residents]}
function sidebar(){const count=openComplaints().length;return `<aside class="sidebar" id="sidebar">${brand()}<div class="nav-label">Workspace</div>${navItems().map(n=>`<button class="nav-item ${state.page===n?'active':''}" data-page="${n}"><span class="icon">${icons[n]||'⌂'}</span>${n}${n==='Complaints'&&state.user.role==='admin'&&count?`<span class="count">${count}</span>`:''}</button>`).join('')}<div class="sidebar-bottom"><div class="nav-label">Account</div><div class="profile"><div class="avatar">${initials()}</div><div><div class="profile-name">${escapeHtml(state.user.name)}</div><div class="profile-role">${state.user.role==='admin'?'Hostel administrator':`Resident · ${escapeHtml(studentRoom().split(' · ')[0])}`}</div></div><button class="logout" aria-label="Sign out" id="logout">↪</button></div></div></aside>`}
function topbar(){const showDot=state.notices&&state.profiles[state.user.email]?.notifications!==false;return `<header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="top-icon mobile-menu" id="mobile-menu">☰</button><div class="crumb">Workspace <span style="padding:0 7px;color:#c3cbc5">/</span><b>${escapeHtml(state.page)}</b></div></div><div class="top-actions"><span class="date-label">${dateLabel()}</span><button class="top-icon" id="notifications" aria-label="Notifications">♧${showDot?'<i class="dot"></i>':''}</button><div class="avatar">${initials()}</div></div></header>`}
function renderDashboard(){const admin=state.user.role==='admin';app.innerHTML=`<div class="shell">${sidebar()}<main class="main">${topbar()}<div class="page">${state.page==='Overview'?`<div class="welcome"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${escapeHtml(state.user.name.split(' ')[0])} 👋</h1><p>${admin?'Here’s what’s happening at your hostel today.':'Here’s what’s happening in your hostel today.'}</p></div><div class="welcome-actions"><span class="date-label">${dateLabel()}</span></div></div>${admin?adminHome():studentHome()}`:genericPage()}</div></main></div>`;bindDashboard()}
function bindDashboard(){app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;renderDashboard()});app.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));app.querySelector('#logout').onclick=()=>{state.user=null;renderLogin()};app.querySelector('#mobile-menu').onclick=()=>app.querySelector('#sidebar').classList.toggle('open');app.querySelector('#notifications').onclick=openNotifications;app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b));app.querySelectorAll('[data-complaint-status]').forEach(select=>select.onchange=()=>{const item=state.complaints.find(c=>c.id===select.dataset.complaintStatus);if(item){item.status=select.value;persist('complaints',state.complaints);state.notices++;persist('notices',state.notices);renderDashboard();toast('Request status updated.')}});app.querySelector('#resident-filter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();app.querySelectorAll('[data-resident-row]').forEach(row=>row.hidden=!row.dataset.residentRow.includes(q))});app.querySelector('#assign-room-form')?.addEventListener('submit',e=>{e.preventDefault();const email=e.target.elements.email.value,room=e.target.elements.room.value,resident=state.residents.find(r=>r.email===email);if(!resident)return;if(state.residents.filter(r=>r.room===room&&r.email!==email).length>=2){toast('That room is full. Choose another room.');return}resident.room=room;saveResidents();renderDashboard();toast('Room assignment saved.')});app.querySelector('#settings-form')?.addEventListener('submit',e=>{e.preventDefault();state.user.name=e.target.elements.name.value.trim();state.profiles[state.user.email]={...(state.profiles[state.user.email]||{}),name:state.user.name,notifications:e.target.elements.notifications.checked};persist('profiles',state.profiles);renderDashboard();toast('Settings saved in this browser.')})}
function handleAction(button){const action=button.dataset.action,id=button.dataset.id;if(action==='mark-paid'){const invoice=state.payments.find(p=>p.id===id);if(invoice){invoice.status='Paid';invoice.paidAt=dateLabel();persist('payments',state.payments);state.notices++;persist('notices',state.notices);renderDashboard();toast('Demo payment marked as paid. No money was charged.')}}else if(action==='assign-room'){const resident=state.residents.find(r=>r.email===button.dataset.email),select=app.querySelector(`[data-room-for="${CSS.escape(button.dataset.email)}"]`);if(resident&&select){if(state.residents.filter(r=>r.room===select.value&&r.email!==resident.email).length>=2){toast('That room is full. Choose another room.');return}resident.room=select.value;saveResidents();renderDashboard();toast('Room assignment saved.')}}else if(action==='save-meal'){const i=Number(button.dataset.index);const lunch=app.querySelector(`[data-meal-cell="${i}-1"]`).value.trim(),dinner=app.querySelector(`[data-meal-cell="${i}-2"]`).value.trim();if(!lunch||!dinner){toast('Enter both meals before saving.');return}state.meals[i][1]=lunch;state.meals[i][2]=dinner;persist('meals',state.meals);renderDashboard();toast('Menu saved for this browser.')}else if(action==='cancel-complaint'){const c=state.complaints.find(x=>x.id===id);if(c){c.status='Cancelled';persist('complaints',state.complaints);renderDashboard();toast('Request cancelled.')}}else if(action==='export-report'){const csv=['Type,Name,Email,Room,Status,Amount',...state.residents.map(r=>`Resident,"${r.name}",${r.email},"${r.room}",Active,`),...allPayments().map(p=>`Invoice,"${p.name}",${p.email},,${p.status},${p.amount}`),...state.complaints.map(c=>`Request,"${c.title}",${c.email},"${c.room}",${c.status},`)].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ravenshaw-hostel-report.csv';a.click();URL.revokeObjectURL(a.href)}}
function openNotifications(){const pending=allPayments().filter(p=>p.status!=='Paid').length,open=openComplaints().length;app.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="notice-backdrop"><div class="modal"><h2>Notifications</h2><p>Your current hostel updates.</p><div class="notice"><span class="notice-icon">₹</span><div><b>${pending} unpaid invoices</b><p>${state.user.role==='admin'?'Review outstanding payments.':'Check your payments page for dues.'}</p></div></div><div class="notice"><span class="notice-icon">☷</span><div><b>${open} open requests</b><p>Track request progress from Complaints.</p></div></div><div class="modal-actions"><button class="secondary" id="close-notices">Close</button><button class="primary" id="read-notices">Mark as read</button></div></div></div>`);app.querySelector('#close-notices').onclick=()=>app.querySelector('#notice-backdrop').remove();app.querySelector('#read-notices').onclick=()=>{state.notices=0;persist('notices',0);renderDashboard()}}
function openModal(type){
 const admin=type==='resident',room=type==='room',invoice=type==='invoice',complaint=type==='complaint';
 const available=state.rooms.filter(room=>state.residents.filter(r=>r.room===room).length<2);
 let fields='';
 if(admin)fields=`<div class="field"><label for="resident-name">Student name</label><input id="resident-name" name="name" placeholder="Full name" required></div><div class="field"><label for="resident-email">Email address</label><input id="resident-email" name="email" type="email" placeholder="student@university.edu" required></div><div class="field"><label for="resident-room">Assign room</label><select id="resident-room" name="room" required><option value="">Select a room</option>${available.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}</select></div>`;
 else if(room)fields=`<div class="field"><label for="room-code">Room number</label><input id="room-code" name="code" placeholder="D-101" required></div><div class="field"><label for="room-block">Block</label><input id="room-block" name="block" placeholder="Block D" required></div>`;
 else if(invoice)fields=`<div class="field"><label for="invoice-email">Resident</label><select id="invoice-email" name="email" required>${residentRowsForInvoice().map(r=>`<option value="${escapeHtml(r.email)}">${escapeHtml(r.name)} · ${escapeHtml(r.email)}</option>`).join('')}</select></div><div class="field"><label for="invoice-period">Billing period</label><input id="invoice-period" name="period" value="${escapeHtml(monthLabel())}" required></div><div class="field"><label for="invoice-amount">Amount (₹)</label><input id="invoice-amount" name="amount" type="number" min="1" value="8500" required></div><div class="field"><label for="invoice-due">Due date</label><input id="invoice-due" name="due" value="10th" required></div>`;
 else fields=`<div class="field"><label for="issue-category">Issue category</label><select id="issue-category" name="category"><option>Maintenance</option><option>Housekeeping</option><option>Food & dining</option><option>Other</option></select></div><div class="field"><label for="issue-title">What needs attention?</label><input id="issue-title" name="title" placeholder="e.g. Leaking bathroom tap" required></div><div class="field"><label for="issue-details">Details</label><textarea id="issue-details" name="details" rows="3" placeholder="Add details that will help us resolve this"></textarea></div>`;
 const title=admin?'Add a resident':room?'Add a room':invoice?'Create an invoice':'Report an issue';
 app.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="backdrop"><form class="modal" id="modal-form"><h2>${title}</h2><p>${invoice||room?'This change is saved in this browser.':admin?'Enter the student details and room assignment.':'This request will appear in the resident and admin views on this browser.'}</p>${fields}<div class="login-error" id="form-error" aria-live="polite"></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" type="submit">${title}</button></div></form></div>`);
 const back=app.querySelector('#backdrop'),form=app.querySelector('#modal-form');app.querySelector('#cancel').onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};
 form.onsubmit=e=>{e.preventDefault();const error=app.querySelector('#form-error');
  if(admin){const name=form.querySelector('#resident-name').value.trim(),email=form.querySelector('#resident-email').value.trim().toLowerCase(),assignedRoom=form.querySelector('#resident-room').value;if(state.residents.some(r=>r.email.toLowerCase()===email)||DEMO_PEOPLE.some(r=>r.email===email)){error.textContent='A resident with this email already exists.';return}if(state.residents.filter(r=>r.room===assignedRoom).length>=2){error.textContent='That room is full. Choose another room.';return}const resident={id:makeId('resident'),name,email,room:assignedRoom,addedAt:new Date().toISOString()};state.residents.unshift(resident);saveResidents();ensureInvoice(email,name);state.notices++;persist('notices',state.notices);back.remove();renderDashboard();toast('Resident added and saved in this browser.');return}
  if(room){const code=form.querySelector('#room-code').value.trim().toUpperCase(),block=form.querySelector('#room-block').value.trim();const label=`${code} · ${block}`;if(state.rooms.some(r=>r.split(' · ')[0].toLowerCase()===code.toLowerCase())){error.textContent='That room number is already listed.';return}state.rooms.push(label);persist('rooms',state.rooms);back.remove();renderDashboard();toast('Room added.');return}
  if(invoice){const email=form.querySelector('#invoice-email').value,period=form.querySelector('#invoice-period').value.trim();if(state.payments.some(p=>p.email===email&&p.period.toLowerCase()===period.toLowerCase())){error.textContent='An invoice already exists for this resident and period.';return}state.payments.unshift({id:makeId('inv'),email,name:residentName(email),period,amount:Number(form.querySelector('#invoice-amount').value),due:form.querySelector('#invoice-due').value.trim(),status:'Due'});persist('payments',state.payments);back.remove();renderDashboard();toast('Invoice created.');return}
  const item={id:makeId('request'),email:state.user.email,name:state.user.name,room:studentRoom(),category:form.querySelector('#issue-category').value,title:form.querySelector('#issue-title').value.trim(),details:form.querySelector('#issue-details').value.trim(),status:'New',createdAt:new Date().toISOString()};state.complaints.unshift(item);persist('complaints',state.complaints);state.notices++;persist('notices',state.notices);back.remove();renderDashboard();toast('Your request was submitted.');
 };
}

let toastTimer;function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3000)}
renderLogin();

  </script>
</body>
</html>
